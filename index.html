<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Misty99</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <section id="authSection" class="card">
      <h1>🎮 Misty99</h1>
      <form id="loginForm">
        <input id="loginIdentity" placeholder="Username or email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>
        <button type="submit">Login</button>
      </form>
      <p><a href="/register.html">Create account</a></p>
      <p id="authMessage" class="message"></p>
    </section>

    <section id="dashboardSection" class="hidden">
      <div class="card">
        <h1>🎮 Misty99 Dashboard</h1>
        <p>Welcome, <b id="username"></b></p>
        <div class="balance">
          <span>Balance</span>
          <strong id="balance">0 CR</strong>
        </div>
      </div>

      <div class="card">
        <h2>🎰 Spin</h2>
        <input id="betAmount" type="number" min="1" step="1" value="10">
        <button id="spinButton" type="button">SPIN NOW</button>
        <p id="gameResult" class="message"></p>
      </div>

      <button id="logoutButton" class="secondary" type="button">Logout</button>
    </section>
  </main>

  <script>
    const KEY = 'misty99_token';
    let token = localStorage.getItem(KEY);
    const $ = (id) => document.getElementById(id);

    async function api(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (options.body && !headers['Content-Type']) {
        headers['Content-Type'] = 'application/json';
      }
      if (token) headers.Authorization = 'Bearer ' + token;

      const response = await fetch(url, { ...options, headers });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || 'Request failed.');
      return data;
    }

    function dashboard(user) {
      $('authSection').classList.add('hidden');
      $('dashboardSection').classList.remove('hidden');
      $('username').textContent = user.username;
      $('balance').textContent = user.balance + ' CR';
    }

    async function loadMe() {
      if (!token) return;
      try {
        const data = await api('/api/auth/me');
        dashboard(data.user);
      } catch {
        localStorage.removeItem(KEY);
        token = null;
        $('authSection').classList.remove('hidden');
        $('dashboardSection').classList.add('hidden');
      }
    }

    $('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('authMessage').textContent = '';
      try {
        const data = await api('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({
            emailOrUsername: $('loginIdentity').value.trim(),
            password: $('loginPassword').value,
          }),
        });
        token = data.token;
        localStorage.setItem(KEY, token);
        dashboard(data.user);
      } catch (error) {
        $('authMessage').textContent = error.message;
      }
    });

    $('spinButton').addEventListener('click', async () => {
      $('gameResult').textContent = '';
      try {
        const bet = Number($('betAmount').value);
        const data = await api('/api/game/spin', {
          method: 'POST',
          body: JSON.stringify({ bet }),
        });
        $('balance').textContent = data.balance + ' CR';
        $('gameResult').textContent = data.message;
      } catch (error) {
        $('gameResult').textContent = error.message;
      }
    });

    $('logoutButton').addEventListener('click', () => {
      localStorage.removeItem(KEY);
      location.reload();
    });

    loadMe();
  </script>
</body>
</html>
